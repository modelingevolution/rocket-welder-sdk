# YOLO segmentation stress generator for native-player overlay perf testing.
#
# This container only runs the YOLO worker. The video pipeline
# (filesrc -> zerosink) is owned by rocket-welder2 and runs on the host.
# Same model as `05-ball-detector`.
#
# Usage:
#   1. In rocket-welder2 (or via gst-launch on host) start a pipeline that
#      writes RGB 1920x1080 frames into a zerobuffer named ${BUFFER_NAME}.
#      Example pipeline string:
#        filesrc location=/path/to/video.mp4 ! decodebin ! videoconvert
#        ! videoscale ! video/x-raw,format=RGB,width=1920,height=1080
#        ! zerosink buffer-name=rw-stress buffer-size=67108864 metadata-size=4096
#   2. cp .env.example .env  (and edit if needed)
#   3. docker compose up --build
#   4. Point native-player at shm://${BUFFER_NAME} and ${SEG_SOCKET}.
#
# Requires:
#   - NVIDIA Container Toolkit registered with Docker (run
#     /tmp/install-nvidia-container-toolkit.sh on Linux hosts).

name: rw-yolo-stress

services:
  yolo-stress:
    image: rw-yolo-stress:latest
    build:
      context: ../..
      dockerfile: examples/08-yolo-stress/Dockerfile
    container_name: rw-yolo-stress
    ipc: host
    network_mode: host
    environment:
      CONNECTION_STRING: "shm://${BUFFER_NAME:-rw-stress}?size=64MB&metadata=4KB"
      SEGMENTATION_SINK_URL: "socket:///tmp/rw-seg.sock"
      YOLO_MODEL: "${YOLO_MODEL:-yolov8x-seg.pt}"
      CONF_THRESHOLD: "${CONF_THRESHOLD:-0.05}"
      INSTANCE_MULTIPLIER: "${INSTANCE_MULTIPLIER:-4}"
      CONTOUR_MODE: "${CONTOUR_MODE:-none}"
    volumes:
      - "${SEG_SOCKET:-/tmp/rw-seg.sock}:/tmp/rw-seg.sock"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
