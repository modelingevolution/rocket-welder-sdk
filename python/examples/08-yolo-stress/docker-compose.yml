# YOLO segmentation stress generator for native-player overlay perf testing.
#
# Standalone usage:
#   docker compose up
#
# Overlay onto the rocket-welder2 stack (from rocket-welder2/src/):
#   docker compose \
#     -f docker-compose.rw.yml -f docker-compose.rw.x64.yml \
#     -f docker-compose.rw.nvidia.yml \
#     -f /path/to/rocket-welder-sdk/python/examples/08-yolo-stress/docker-compose.yml \
#     up
#
# Required env (export or put in .env next to this file):
#   VIDEO_PATH       Absolute path to a 1080p .mp4 on the host.
#   PLUGINS_PATH     Path to GStreamer plugins folder containing gstzerobuffer.so
#                    (e.g. /mnt/d/source/modelingevolution/streamer/src/out/build/Linux-WSL-Debug/app/plugins).
#
# Optional env:
#   YOLO_MODEL              ultralytics model (default yolov8x-seg.pt)
#   CONF_THRESHOLD          detection confidence floor (default 0.05)
#   INSTANCE_MULTIPLIER     re-emit each polygon N times (default 4)
#   CONTOUR_MODE            none|simple (default none = max vertices)
#   BUFFER_NAME             zerobuffer shm name (default rw-stress)
#   SEG_SOCKET              host path for segmentation unix socket
#                           (default /tmp/rw-seg.sock)

name: rw-yolo-stress

services:
  feeder:
    build:
      context: .
      dockerfile: Dockerfile.feeder
    image: rw-stress-feeder:latest
    container_name: rw-stress-feeder
    ipc: host
    network_mode: host
    volumes:
      - "${VIDEO_PATH:?set VIDEO_PATH to a 1080p mp4}:/data/video.mp4:ro"
      - "${PLUGINS_PATH:?set PLUGINS_PATH to streamer plugins folder}:/gst-plugins:ro"
    environment:
      GST_PLUGIN_PATH: /gst-plugins
      GST_DEBUG: "2,GST_PLUGIN_LOADING:4"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "gst-inspect-1.0 zerosink >/dev/null 2>&1 || { echo 'zerosink not loadable inside this image - see README troubleshooting'; ldd /gst-plugins/gstzerobuffer.so | sed -n '1,40p'; exit 1; }; exec gst-launch-1.0 -v filesrc location=/data/video.mp4 ! decodebin ! videoconvert ! videoscale ! video/x-raw,format=RGB,width=1920,height=1080 ! zerosink buffer-name=${BUFFER_NAME:-rw-stress} buffer-size=67108864 metadata-size=4096"
    restart: unless-stopped

  yolo-stress:
    image: rw-yolo-stress:latest
    build:
      context: ../..
      dockerfile: examples/08-yolo-stress/Dockerfile
    container_name: rw-yolo-stress
    ipc: host
    network_mode: host
    depends_on:
      - feeder
    environment:
      CONNECTION_STRING: "shm://${BUFFER_NAME:-rw-stress}?size=64MB&metadata=4KB"
      SEGMENTATION_SINK_URL: "unix:///tmp/rw-seg.sock"
      YOLO_MODEL: "${YOLO_MODEL:-yolov8x-seg.pt}"
      CONF_THRESHOLD: "${CONF_THRESHOLD:-0.05}"
      INSTANCE_MULTIPLIER: "${INSTANCE_MULTIPLIER:-4}"
      CONTOUR_MODE: "${CONTOUR_MODE:-none}"
    volumes:
      - "${SEG_SOCKET:-/tmp/rw-seg.sock}:/tmp/rw-seg.sock"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
