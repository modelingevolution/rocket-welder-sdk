<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RocketWelder SDK Blazor Sample</title>
    <base href="/" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .loading h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <h2>Loading RocketWelder SDK Demo...</h2>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; background: lightyellow; padding: 1em;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
