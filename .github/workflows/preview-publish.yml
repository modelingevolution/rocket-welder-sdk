name: Publish Preview SDKs

on:
  push:
    branches:
      - 'feature/*'
    paths:
      - 'csharp/**'
      - 'python/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (e.g., 1.1.34-preview.1)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate preview version
      id: version
      run: |
        # Use input version if provided
        if [ -n "${{ github.event.inputs.version }}" ]; then
          PREVIEW_VERSION="${{ github.event.inputs.version }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Preview version (from input): $PREVIEW_VERSION"
          exit 0
        fi

        # Get latest stable tag (exclude preview tags)
        LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v preview | sort -V | tail -n1 || echo "v0.0.0")
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG="v0.0.0"
        fi
        VERSION="${LATEST_TAG#v}"

        # Parse version components (only X.Y.Z, no suffixes)
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MAJOR=${MAJOR:-0}
        MINOR=${MINOR:-0}
        PATCH=${PATCH:-0}
        # Strip any non-numeric suffix from PATCH
        PATCH=$(echo "$PATCH" | grep -oE '^[0-9]+' || echo "0")

        # Bump patch for preview
        PATCH=$((PATCH + 1))

        # Get short SHA
        SHORT_SHA=$(git rev-parse --short HEAD)

        # Generate preview version
        PREVIEW_VERSION="$MAJOR.$MINOR.$PATCH-preview.$SHORT_SHA"

        echo "version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Preview version: $PREVIEW_VERSION"

  publish-csharp-preview:
    needs: preview-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./csharp
      run: dotnet restore

    - name: Build
      working-directory: ./csharp
      run: dotnet build --configuration Release --no-restore /p:Version=${{ needs.preview-version.outputs.version }}

    - name: Pack all packable packages
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.sln --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push all packages to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to ModelingEvolution NuGet
      id: push_me
      working-directory: ./csharp
      # Non-fatal for the same reason as the release path: nuget.org has already accepted every
      # package by this point, and the org feed is self-hosted and has gone unreachable mid-run
      # before. Dying here would leave a half-published preview.
      #
      # What is NOT acceptable is discarding the result, which is what this step used to do — the
      # run went green whether the feed took the packages or was switched off. The outcome is now
      # recorded and the "Verify" step below decides the job.
      continue-on-error: true
      run: |
        if dotnet nuget push "./nupkg/*.nupkg" \
             --api-key ${{ secrets.NUGET_API_KEY_ME }} \
             --source https://nuget.modelingevolution.com/v3/index.json \
             --skip-duplicate
        then
          echo "outcome=success" >> $GITHUB_OUTPUT
        else
          echo "outcome=failed" >> $GITHUB_OUTPUT
          echo "::warning::Push to the ModelingEvolution feed reported a failure. Not fatal here \
        so nuget.org is not left half-published — the Verify step decides whether this preview stands."
        fi

    - name: Verify both feeds actually serve this preview
      working-directory: ./csharp
      env:
        VERSION: ${{ needs.preview-version.outputs.version }}
        PUSH_OUTCOME: ${{ steps.push_me.outputs.outcome }}
        # Shorter budget than the release path on purpose: this runs on every push to every
        # feature/* branch, so minutes spent waiting here are paid far more often than at release.
        # A preview that has not indexed inside ten minutes is a real problem, not lag.
        TIMEOUT_SECONDS: '600'
        POLL_SECONDS: '15'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/verify-feeds.sh"

    - name: Summary
      working-directory: ./csharp
      run: |
        echo "## C# Packages Preview Published to NuGet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.preview-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        VERSION="${{ needs.preview-version.outputs.version }}"
        for PKG_FILE in ./nupkg/*.nupkg; do
          PKG_NAME=$(basename "$PKG_FILE")
          # Strip version + .nupkg suffix to recover the package id
          PKG_ID="${PKG_NAME%.${VERSION}.nupkg}"
          echo "### ${PKG_ID}" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package ${PKG_ID} --version ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done

  publish-python-preview:
    needs: preview-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create VERSION file
      run: |
        # Convert NuGet version to PEP 440 compliant version
        # NuGet: 1.1.34-preview.a66d687 -> PyPI: 1.1.34.dev<run_number>
        NUGET_VERSION="${{ needs.preview-version.outputs.version }}"
        RUN_NUMBER="${{ github.run_number }}"

        # Extract base version (before -preview)
        BASE_VERSION=$(echo "$NUGET_VERSION" | sed 's/-preview.*//')

        # Create PEP 440 compliant version: X.Y.Z.devN (development release)
        PEP440_VERSION="${BASE_VERSION}.dev${RUN_NUMBER}"

        echo "NuGet version: $NUGET_VERSION"
        echo "PEP 440 version: $PEP440_VERSION"

        cd python
        echo "$PEP440_VERSION" > VERSION

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      working-directory: ./python
      run: python -m build

    - name: Check package
      working-directory: ./python
      run: twine check dist/*

    - name: Publish to Test PyPI
      working-directory: ./python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      # DELIBERATELY non-fatal, and not the same defect as the NuGet org-feed push above. Test
      # PyPI is a scratch index nobody installs from: no consumer restores it, so a run that
      # "succeeds" without it has not misled anyone. The authoritative PyPI upload is the next
      # step and is already fatal. Leave this as it is.
      continue-on-error: true
      run: |
        twine upload --repository testpypi dist/* --skip-existing

    - name: Publish to PyPI
      working-directory: ./python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing

    - name: Summary
      run: |
        echo "## Python SDK Preview Published to PyPI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.preview-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: rocket-welder-sdk" >> $GITHUB_STEP_SUMMARY
        echo "- **PyPI**: https://pypi.org/project/rocket-welder-sdk/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Install with:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'pip install rocket-welder-sdk==${{ needs.preview-version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
