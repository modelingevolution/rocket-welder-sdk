name: Publish Preview SDKs

on:
  push:
    branches:
      - 'feature/*'
    paths:
      - 'csharp/**'
      - 'python/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (e.g., 1.1.34-preview.1)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate preview version
      id: version
      run: |
        # Use input version if provided
        if [ -n "${{ github.event.inputs.version }}" ]; then
          PREVIEW_VERSION="${{ github.event.inputs.version }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Preview version (from input): $PREVIEW_VERSION"
          exit 0
        fi

        # Get latest stable tag (exclude preview tags)
        LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v preview | sort -V | tail -n1 || echo "v0.0.0")
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG="v0.0.0"
        fi
        VERSION="${LATEST_TAG#v}"

        # Parse version components (only X.Y.Z, no suffixes)
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MAJOR=${MAJOR:-0}
        MINOR=${MINOR:-0}
        PATCH=${PATCH:-0}
        # Strip any non-numeric suffix from PATCH
        PATCH=$(echo "$PATCH" | grep -oE '^[0-9]+' || echo "0")

        # Bump patch for preview
        PATCH=$((PATCH + 1))

        # Get short SHA
        SHORT_SHA=$(git rev-parse --short HEAD)

        # Generate preview version
        PREVIEW_VERSION="$MAJOR.$MINOR.$PATCH-preview.$SHORT_SHA"

        echo "version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Preview version: $PREVIEW_VERSION"

  publish-csharp-preview:
    needs: preview-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./csharp
      run: dotnet restore

    - name: Build
      working-directory: ./csharp
      run: dotnet build --configuration Release --no-restore /p:Version=${{ needs.preview-version.outputs.version }}

    - name: Pack SDK.Automation
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Automation/RocketWelder.SDK.Automation.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Automation to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Automation.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK.Types
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Types/RocketWelder.SDK.Types.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Types to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Types.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK.Protocols
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Protocols/RocketWelder.SDK.Protocols.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Protocols to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Protocols.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK/RocketWelder.SDK.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK.Blazor
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Blazor/RocketWelder.SDK.Blazor.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Blazor to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Blazor.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK.Server
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Server/RocketWelder.SDK.Server.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Server to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Server.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Pack SDK.Robotics.Core
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.Robotics.Core/RocketWelder.SDK.Robotics.Core.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ needs.preview-version.outputs.version }}

    - name: Push SDK.Robotics.Core to NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push ./nupkg/RocketWelder.SDK.Robotics.Core.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to ModelingEvolution NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY_ME }} \
          --source https://nuget.modelingevolution.com/v3/index.json \
          --skip-duplicate
      continue-on-error: true

    - name: Summary
      run: |
        echo "## C# Packages Preview Published to NuGet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.preview-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        for PKG in SDK.Automation SDK.Types SDK.Protocols SDK SDK.Blazor SDK.Server SDK.Robotics.Core; do
          echo "### RocketWelder.$PKG" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package RocketWelder.$PKG --version ${{ needs.preview-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done

  publish-python-preview:
    needs: preview-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create VERSION file
      run: |
        # Convert NuGet version to PEP 440 compliant version
        # NuGet: 1.1.34-preview.a66d687 -> PyPI: 1.1.34.dev<run_number>
        NUGET_VERSION="${{ needs.preview-version.outputs.version }}"
        RUN_NUMBER="${{ github.run_number }}"

        # Extract base version (before -preview)
        BASE_VERSION=$(echo "$NUGET_VERSION" | sed 's/-preview.*//')

        # Create PEP 440 compliant version: X.Y.Z.devN (development release)
        PEP440_VERSION="${BASE_VERSION}.dev${RUN_NUMBER}"

        echo "NuGet version: $NUGET_VERSION"
        echo "PEP 440 version: $PEP440_VERSION"

        cd python
        echo "$PEP440_VERSION" > VERSION

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      working-directory: ./python
      run: python -m build

    - name: Check package
      working-directory: ./python
      run: twine check dist/*

    - name: Publish to Test PyPI
      working-directory: ./python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --skip-existing
      continue-on-error: true

    - name: Publish to PyPI
      working-directory: ./python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing

    - name: Summary
      run: |
        echo "## Python SDK Preview Published to PyPI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.preview-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: rocket-welder-sdk" >> $GITHUB_STEP_SUMMARY
        echo "- **PyPI**: https://pypi.org/project/rocket-welder-sdk/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Install with:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'pip install rocket-welder-sdk==${{ needs.preview-version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
