name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-preview*'
      - 'python-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rocket-welder-sdk/

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#python-v}"
        fi
        # Convert preview versions to PEP 440 format
        # 1.1.34-preview.1 -> 1.1.34a1
        if [[ "$VERSION" == *"-preview"* ]]; then
          BASE_VERSION="${VERSION%%-preview*}"
          PREVIEW_NUM="${VERSION##*-preview.}"
          VERSION="${BASE_VERSION}a${PREVIEW_NUM}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Create VERSION file
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cd python
        # Create VERSION file for setup.py to read
        echo "$VERSION" > VERSION
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      working-directory: ./python
      run: python -m build
    
    - name: Check package
      working-directory: ./python
      run: twine check dist/*
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
    
    - name: Summary
      run: |
        echo "## Python SDK Published to PyPI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: rocket-welder-sdk" >> $GITHUB_STEP_SUMMARY
        echo "- **PyPI**: https://pypi.org/project/rocket-welder-sdk/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Install with:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'pip install rocket-welder-sdk==${{ steps.version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY