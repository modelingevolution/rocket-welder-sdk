name: Publish C# SDK to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-preview*'
      - 'csharp-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#csharp-v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Restore dependencies
      working-directory: ./csharp
      run: dotnet restore
    
    - name: Build
      working-directory: ./csharp
      run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}
    
    - name: Pack all packable packages
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.sln --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Push all packages to NuGet
      working-directory: ./csharp
      # Push per file so one rejected package (e.g. an API key whose glob
      # doesn't cover the root id) cannot abort the remaining pushes.
      # The step still fails at the end, listing exactly what was rejected.
      run: |
        failed=""
        for pkg in ./nupkg/*.nupkg; do
          echo "Pushing $pkg"
          dotnet nuget push "$pkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || failed="$failed $pkg"
        done
        if [ -n "$failed" ]; then
          echo "::error::Failed to push:$failed"
          exit 1
        fi
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to ModelingEvolution NuGet
      working-directory: ./csharp
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY_ME }} \
          --source https://nuget.modelingevolution.com/v3/index.json \
          --skip-duplicate
      continue-on-error: true

    - name: Summary
      working-directory: ./csharp
      run: |
        echo "## C# Packages Published to NuGet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        VERSION="${{ steps.version.outputs.version }}"
        for PKG_FILE in ./nupkg/*.nupkg; do
          PKG_NAME=$(basename "$PKG_FILE")
          # Strip version + .nupkg suffix to recover the package id
          PKG_ID="${PKG_NAME%.${VERSION}.nupkg}"
          echo "### ${PKG_ID}" >> $GITHUB_STEP_SUMMARY
          echo "- **NuGet**: https://www.nuget.org/packages/${PKG_ID}" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package ${PKG_ID} --version ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done