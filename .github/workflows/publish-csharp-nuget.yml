name: Publish C# SDK to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-preview*'
      - 'csharp-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#csharp-v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Restore dependencies
      working-directory: ./csharp
      run: dotnet restore
    
    - name: Build
      working-directory: ./csharp
      run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}
    
    - name: Pack all packable packages
      working-directory: ./csharp
      run: dotnet pack RocketWelder.SDK.sln --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Push all packages to NuGet
      working-directory: ./csharp
      # Push per file so one rejected package (e.g. an API key whose glob
      # doesn't cover the root id) cannot abort the remaining pushes.
      # The step still fails at the end, listing exactly what was rejected.
      run: |
        failed=""
        for pkg in ./nupkg/*.nupkg; do
          echo "Pushing $pkg"
          dotnet nuget push "$pkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || failed="$failed $pkg"
        done
        if [ -n "$failed" ]; then
          echo "::error::Failed to push:$failed"
          exit 1
        fi
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to ModelingEvolution NuGet
      id: push_me
      working-directory: ./csharp
      # Still non-fatal, ON PURPOSE and for one reason only: nuget.org has already accepted
      # every package by this point, and the org feed is self-hosted and has gone unreachable
      # mid-release before (Devices.Motion/dev-log.md, 2026-08-20 feed outage). Dying here
      # would leave a half-published release, which is worse than a late one.
      #
      # What is NOT acceptable is discarding the result, which is what this step used to do:
      # the job went green whether the feed took the packages or was switched off. The outcome
      # is now recorded and the "Verify" step below is what actually decides the job.
      continue-on-error: true
      run: |
        if dotnet nuget push "./nupkg/*.nupkg" \
             --api-key ${{ secrets.NUGET_API_KEY_ME }} \
             --source https://nuget.modelingevolution.com/v3/index.json \
             --skip-duplicate
        then
          echo "outcome=success" >> $GITHUB_OUTPUT
        else
          echo "outcome=failed" >> $GITHUB_OUTPUT
          echo "::warning::Push to the ModelingEvolution feed reported a failure. Not fatal here \
        so nuget.org is not left half-published — the Verify step decides whether this release stands."
        fi

    - name: Verify both feeds actually serve this version
      working-directory: ./csharp
      env:
        VERSION: ${{ steps.version.outputs.version }}
        # nuget.org validates and indexes asynchronously, package by package — measured at
        # roughly five minutes for a 22-package release, with some ids fetchable while others
        # still 404. Poll to that shape rather than checking once and calling it a failure.
        TIMEOUT_SECONDS: '900'
        POLL_SECONDS: '15'
      run: |
        set -u
        # A push returning 0 is not the same fact as a package a consumer can restore, and the
        # release status is read as if it were. This step closes that gap: it asks each feed
        # for the versions it serves and fails the job if this one is missing from either.
        #
        # EVERY packed package is checked, not a representative one — nuget.org indexes them
        # independently, so "the first one is up" says nothing about the twenty-second.
        #
        # The two feeds expose the same {"versions":[...]} body under DIFFERENT paths:
        #   nuget.org  -> /v3-flatcontainer/<id>/index.json
        #   org feed   -> /v3/package/<id>/index.json
        # Ids are lowercased in both.
        ids=""
        for f in ./nupkg/*.nupkg; do
          b="$(basename "$f")"
          ids="$ids ${b%".${VERSION}.nupkg"}"
        done
        total="$(echo $ids | wc -w)"
        echo "Verifying $total package(s) at version $VERSION on both feeds..."

        deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
        while :; do
          missing=""
          for id in $ids; do
            lid="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            for feed in \
              "nuget.org|https://api.nuget.org/v3-flatcontainer/$lid/index.json" \
              "modelingevolution|https://nuget.modelingevolution.com/v3/package/$lid/index.json"
            do
              name="${feed%%|*}"; url="${feed#*|}"
              # `|| true` so one dropped connection cannot end the whole verification.
              body="$(curl -sS --max-time 20 "$url" 2>/dev/null || true)"
              case "$body" in
                *"\"$VERSION\""*) ;;
                *) missing="$missing $name:$id" ;;
              esac
            done
          done

          # `if`, not `[ ... ] && break`: under `set -e` an AND-OR list whose test fails is a
          # non-zero statement, and that has ended jobs before.
          if [ -z "$missing" ]; then break; fi
          now="$(date +%s)"
          if [ "$now" -ge "$deadline" ]; then break; fi
          echo "  still indexing ($(( deadline - now ))s left) — missing:$missing"
          sleep "$POLL_SECONDS"
        done

        if [ -n "$missing" ]; then
          echo "::error::Release $VERSION is NOT fetchable from every feed after ${TIMEOUT_SECONDS}s. \
        Missing as feed:package —$missing (ModelingEvolution push step reported: \
        ${{ steps.push_me.outputs.outcome }}). The tag exists and nuget.org may be serving part of \
        the release: verify before re-running, and never re-cut the tag to fix a feed problem."
          exit 1
        fi

        echo "All $total package(s) serve $VERSION from nuget.org and the ModelingEvolution feed."

    - name: Summary
      working-directory: ./csharp
      run: |
        echo "## C# Packages Published to NuGet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        VERSION="${{ steps.version.outputs.version }}"
        for PKG_FILE in ./nupkg/*.nupkg; do
          PKG_NAME=$(basename "$PKG_FILE")
          # Strip version + .nupkg suffix to recover the package id
          PKG_ID="${PKG_NAME%.${VERSION}.nupkg}"
          echo "### ${PKG_ID}" >> $GITHUB_STEP_SUMMARY
          echo "- **NuGet**: https://www.nuget.org/packages/${PKG_ID}" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package ${PKG_ID} --version ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        done